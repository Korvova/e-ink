[platformio]
; ld.exe cannot write firmware.map into a path with Cyrillic letters -> build outside the project
build_dir = C:/app/_pio_build/e-ink

[env:esp32-s3-devkitc-1]
; pioarduino = Arduino core 3.x (native W5500 Ethernet via ETH.h)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
upload_port = COM29
monitor_port = COM29

; TTF fonts embedded into the firmware (PT Sans, OFL, Latin+Cyrillic subset)
board_build.embed_files =
    data/ptsans.ttf
    data/ptsansb.ttf

lib_deps =
    https://github.com/takkaO/OpenFontRender.git

; For YB-ESP32-S3-ETH via CH343 UART bridge, leave native USB-CDC flags disabled.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Default e-ink pin set at boot: second module (runtime-switchable)
    -DEPD_PIN_MOSI=35
    -DEPD_PIN_CLK=36
    -DEPD_PIN_CS=41
    -DEPD_PIN_CS2=42
    -DEPD_PIN_RST=45
    -DEPD_PIN_BUSY=1
